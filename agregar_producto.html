<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Dashboard - Agregar Productos</title>

    <meta charset="UTF-8">
    <title>Dashboard</title>




<link rel="stylesheet" href="agregar_producto.css">
</head>

<body>

<div class="sidebar">

    <h2>MENÚ</h2>

    <a href="dashboard.html">🏷 Agregar precios</a>

    <a href="agregar_producto.html" class="active">🗻regresa a la pagina principal</a>

</div>

<div class="main">

    <div class="header">

        <div class="header-left">
            <img src="img/moto.jpg">
            <h1>Panel de Control — Ing. Oscar</h1>
        </div>

        <button class="logout-btn" onclick="cerrarSesion()">
            Cerrar sesión
            <script>
                function cerrarSesion(){

    localStorage.removeItem("usuarioLogueado");

    window.location.href = "login.html";
}
            </script>
        </button>

    </div>

    <div class="content">

        <div class="seccion-agregar">

            <h2>¿Qué producto quieres agregar?</h2>

            <div class="formulario-contenedor">

                <!-- FOTO -->
                <div class="foto-uploader">

                    <div class="foto-preview-box"
                    onclick="document.getElementById('fileInput').click()">

                        <div class="icon-cam">📷</div>

                        <span id="uploadText">Añade una foto</span>

                        <img id="imagePreview">

                    </div>

                    <input type="file"
                    id="fileInput"
                    accept="image/*"
                    style="display:none;"
                    onchange="previewImage(event)">

                </div>

                <!-- CAMPOS -->
                 
<div class="campos-columna">

    <div class="input-group">
        <label>Marca:</label>
        <input type="text" id="marca">
    </div>

    <div class="input-group">
        <label>Modelo:</label>
        <input type="text" id="modelo">
    </div>

    <div class="input-group">
        <label>Categoría:</label>

        <select id="categoria">

            <option value="">
                Seleccione una categoría
            </option>

            <option value="Camara">
                Camara
            </option>

            <option value="DVR">
                DVR
            </option>

            <option value="Fuente de Poder">
                Fuente de Poder
            </option>

            <option value="Monitor">
                Monitor
            </option>

            <option value="Disco Duro">
                Disco Duro
            </option>

            <option value="Cable">
                Cable
            </option>

            <option value="Accesorio">
                Accesorio
            </option>

        </select>
    </div>

    <div class="input-group">
        <label>Número de Serie:</label>
        <input type="text" id="serial">
    </div>

    <div class="input-group">
        <label>Precio:</label>
        <input type="number" id="precio">
    </div>

    <div class="input-group">
        <label>Stock:</label>
        <input type="number" id="stock">
    </div>

    <div class="input-group full-width">
        <label>Descripción:</label>
        <textarea id="descripcion" rows="3"></textarea>
    </div>

    <div class="input-group full-width">
        <label>Características:</label>
        <textarea id="caracteristicas" rows="5"></textarea>
    </div>

    <div class="botones-contenedor">

        <button class="btn-guardar"
        onclick="simularGuardado()">
            Guardar
        </button>

        <button class="btn-cancelar"
        onclick="limpiarFormulario()">
            Cancelar
        </button>

    </div>

    <div class="mensaje-exito" id="msgExito">
        ✔ Producto agregado correctamente
    </div>

</div>
                </div>

            </div>

        </div>

    </div>

    <footer>
        Soporte y garantías Worldcam © 2026
    </footer>

</div>


<script src="agregar_producto.js"></script>
<script>

if(
    localStorage.getItem(
        "usuarioLogueado"
    ) !== "true"
){

    window.location.href =
    "login.html";

}

</script>
</body>
</html>

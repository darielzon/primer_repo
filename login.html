<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Remates</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background: #e8edf3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* TITULO */
        .titulo{
            margin-bottom: 30px;
            text-align: center;
        }

        .titulo h1{
            font-size: 42px;
            color: #1e293b;
            letter-spacing: 2px;
        }

        /* CONTENEDOR PRINCIPAL */
        .contenedor-login{
            width: 420px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.2);
        }

        .contenedor-login h2{
            text-align: center;
            margin-bottom: 35px;
            color: #334155;
        }

        /* LABELS */
        label{
            display: block;
            margin-bottom: 8px;
            margin-top: 15px;
            font-weight: bold;
            color: #475569;
        }

        /* INPUTS */
        input{
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus{
            border-color: #2563eb;
            box-shadow: 0px 0px 8px rgba(37,99,235,0.4);
        }

        /* BOTON */
        .btn-login{
            width: 100%;
            margin-top: 30px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover{
            background: #1d4ed8;
        }

        /* FOOTER */
        footer{
            margin-top: 30px;
            text-align: center;
            color: #475569;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <!-- TITULO -->
    <div class="titulo">
        <h1>CONTROL DE REMATES</h1>
    </div>

    <!-- LOGIN -->
    <div class="contenedor-login">

        <h2>Inicia Sesión</h2>

        <form>

     <input
type="text"
id="usuario"
placeholder="Ingresa tu usuario">

<input
type="password"
id="password"
placeholder="Ingresa tu contraseña">

         <button  type="button" class="btn-login" onclick="entrar()">
    Entrar
</button>

        </form>

    </div>
   

    
    <footer>
        <p>Worldcam © 2026</p>
        <p>Soporte y garantías</p>
    </footer>
 




<script src="login.js"></script>
</body>
</html>
